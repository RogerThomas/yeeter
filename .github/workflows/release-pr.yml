name: release-pr

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into pyproject.toml (blank = auto-increment today's CalVer)"
        default: ""
        required: false

jobs:
  open-release-pr:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Install task
        uses: arduino/setup-task@v2

      - name: Update project version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            task release-version -- --version "${{ inputs.version }}"
          else
            task release-version
          fi
          echo "--- pyproject.toml head ---"
          head -n 10 pyproject.toml

      - name: Read resolved version
        id: read-version
        run: |
          release_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(pyproject["project"]["version"])
          PY
          )"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $release_version"

      - name: Create release branch
        run: |
          git switch -c "release/${{ steps.read-version.outputs.release_version }}"

      - name: Fetch existing release branch
        run: |
          git fetch origin "release/${{ steps.read-version.outputs.release_version }}":"refs/remotes/origin/release/${{ steps.read-version.outputs.release_version }}" || true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        id: commit
        run: |
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "No version file changes to commit."
            echo "did_commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: release ${{ steps.read-version.outputs.release_version }}"
          git push --force-with-lease --set-upstream origin "release/${{ steps.read-version.outputs.release_version }}"
          echo "did_commit=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: ${{ steps.commit.outputs.did_commit == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/${{ steps.read-version.outputs.release_version }}"
          title="chore: release ${{ steps.read-version.outputs.release_version }}"
          body="Automated release version bump for ${{ steps.read-version.outputs.release_version }}."
          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
            gh pr view "$existing_pr" --json url --jq '.url'
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "$title" \
              --body "$body"
          fi
