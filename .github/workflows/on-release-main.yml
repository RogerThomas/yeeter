name: release-main

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into pyproject.toml (blank = auto-increment today's CalVer)"
        default: ""
        required: false
      publish:
        description: "Actually publish to PyPI?"
        type: boolean
        default: false

jobs:

  set-version:
    runs-on: ubuntu-24.04
    outputs:
      release-version: ${{ steps.read-version.outputs.release_version }}
      persist-ref: ${{ steps.persist-ref.outputs.persist_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Install task
        uses: arduino/setup-task@v2

      - name: Choose ref to persist version files
        id: persist-ref
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            persist_ref="${{ github.event.repository.default_branch }}"
          else
            persist_ref="${{ github.ref_name }}"
          fi
          echo "persist_ref=$persist_ref" >> "$GITHUB_OUTPUT"
          echo "Persisting version files to: $persist_ref"

      - name: Update project version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            task release-version -- --version "${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            task release-version -- --version "${{ inputs.version }}"
          else
            task release-version
          fi
          echo "--- pyproject.toml head ---"
          head -n 10 pyproject.toml

      - name: Read resolved version
        id: read-version
        run: |
          release_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(pyproject["project"]["version"])
          PY
          )"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $release_version"

      - name: Upload updated release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            pyproject.toml
            uv.lock

  publish:
    runs-on: ubuntu-latest
    needs: [set-version]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Download updated release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: .

      - name: Build package
        run: uv build

      - name: Show built artifacts
        run: ls -la dist/

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Publish package
        if: ${{ github.event_name == 'release' || inputs.publish }}
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  persist-version:
    runs-on: ubuntu-latest
    needs: [set-version, publish]
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-version.outputs.persist-ref }}

      - name: Download updated release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: .

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated version files
        run: |
          git add pyproject.toml uv.lock
          if git diff --cached --quiet; then
            echo "No version file changes to commit."
            exit 0
          fi
          git commit -m "chore: release ${{ needs.set-version.outputs.release-version }}"
          git push origin HEAD:${{ needs.set-version.outputs.persist-ref }}

      - name: Create release tag
        if: ${{ github.event_name != 'release' }}
        run: |
          git tag -a "${{ needs.set-version.outputs.release-version }}" -m "Release ${{ needs.set-version.outputs.release-version }}"
          git push origin "${{ needs.set-version.outputs.release-version }}"

  create-release:
    runs-on: ubuntu-latest
    needs: [set-version, publish, persist-version]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.set-version.outputs.release-version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.set-version.outputs.release-version }}" \
            --generate-notes \
            --verify-tag

  deploy-docs:
    needs: [publish, persist-version]
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run mkdocs build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
