name: release

permissions:
  contents: write
  pages: write
  id-token: write

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  tag-release:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/') }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate release branch name
        run: |
          branch_name="${{ github.event.pull_request.head.ref }}"
          if [[ ! "${branch_name}" =~ ^release/[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.post[0-9]+)?$ ]]; then
            echo "Invalid release branch name: ${branch_name}" >&2
            exit 1
          fi

      - name: Read release version
        id: read-version
        run: |
          release_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(pyproject["project"]["version"])
          PY
          )"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $release_version"

      - name: Check whether the release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.read-version.outputs.release_version }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release tag
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.read-version.outputs.release_version }}" -m "Release ${{ steps.read-version.outputs.release_version }}"
          git push origin "${{ steps.read-version.outputs.release_version }}"

      - name: Create GitHub release
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.read-version.outputs.release_version }}" \
            --generate-notes \
            --verify-tag

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      - name: Build package
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        run: uv build

      - name: Publish package
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Build documentation
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        run: uv run mkdocs build --clean

      - name: Upload artifact
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        id: deployment
        uses: actions/deploy-pages@v5
