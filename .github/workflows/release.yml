name: release

# Manually dispatched (locally via `task release`, or from the Actions tab).
# Cuts a CalVer release entirely in CI — bump, commit, tag, publish, deploy —
# so nothing mutating runs on a developer machine.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (leave blank for the next CalVer for today)"
        required: false
        default: ""

jobs:

  release:
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC) — no PyPI token. The environment name must match
    # the one configured on the PyPI publisher ("pypi").
    environment:
      name: pypi
      url: https://pypi.org/p/yeetr
    permissions:
      contents: write   # push the version-bump commit and create the release
      id-token: write   # OIDC token for PyPI Trusted Publishing
    outputs:
      version: ${{ steps.cut.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Cut the release
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ github.event.inputs.version }}"
          version="${version:-$(uv run yeet scripts/next_version.py)}"
          uv version "$version"
          uv lock
          resolved="$(uv version --short)"
          if [ "$resolved" != "$version" ]; then
            echo "::error::resolved version $resolved does not match requested $version"
            exit 1
          fi
          git commit -am "release $version"
          git push origin HEAD:main
          gh release create "$version" --target main --title "$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish

  deploy-docs:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run yeet scripts/build_docs.py --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
