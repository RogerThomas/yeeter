name: release

permissions:
  contents: write

on:
  push:
    tags:
      - "*.*.*"

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Validate release tag name
        run: |
          tag_name="${{ github.ref_name }}"
          if [[ ! "${tag_name}" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.post[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag_name}" >&2
            exit 1
          fi

      - name: Read release version
        id: read-version
        run: |
          release_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          print(pyproject["project"]["version"])
          PY
          )"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $release_version"

      - name: Validate tag matches project version
        run: |
          if [[ "${{ github.ref_name }}" != "${{ steps.read-version.outputs.release_version }}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${{ steps.read-version.outputs.release_version }}" >&2
            exit 1
          fi

      - name: Check whether the release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.read-version.outputs.release_version }}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: ${{ steps.release-check.outputs.release_exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          gh release create "${{ steps.read-version.outputs.release_version }}" \
            --generate-notes \
            --verify-tag
