[project]
name = "yeeter"
version = "0.0.1"
description = "A tiny, typed, signature-driven CLI runner."
authors = [{ name = "yeeter", email = "noreply@example.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ['python']
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "rich>=15.0.0",
    "rich-argparse>=1.5.2",
    "typer>=0.25.1",
]

[project.optional-dependencies]
uvloop = ["uvloop>=0.21.0"]

[project.scripts]
yeet = "yeeter._cli:main"

[project.urls]
Homepage = "https://fpgmaas.github.io/yeeter/"
Repository = "https://github.com/fpgmaas/yeeter"
Documentation = "https://fpgmaas.github.io/yeeter/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "pyright>=1.1.380",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "prek>=0.4.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yeeter"
module-root = ""

[tool.pyright]
include = ["yeeter", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.lint]
select = [

    "YTT",# flake8-2020
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # RaiseLongMessages (intentional: dynamic messages)
    "TRY003",
    # ShadowingPythonBuiltin (`help`, `format` are deliberate user-facing names)
    "A002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B006"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["yeeter"]
