[project]
name = "yeeter"
version = "2026.5.21"
description = "A tiny, typed, signature-driven CLI runner."
authors = [{ name = "yeeter", email = "noreply@example.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ['python']
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["rich>=15.0.0", "rich-argparse>=1.5.2"]

[project.optional-dependencies]
uvloop = ["uvloop>=0.21.0"]

[project.scripts]
yeet = "yeeter._cli:main"

[project.urls]
Homepage = "https://fpgmaas.github.io/yeeter/"
Repository = "https://github.com/fpgmaas/yeeter"
Documentation = "https://fpgmaas.github.io/yeeter/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "pyright>=1.1.380",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "prek>=0.4.1",
    "pylint>=3.3.8",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yeeter"
module-root = ""

[tool.pyright]
include = ["yeeter", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "A",   # builtins shadowing
    "ANN", # type annotations
    "ARG", # unused arguments
    "B",   # bugbear (common bugs & bad patterns)
    "BLE", # blind excepts
    "C4",  # comprehensions
    "COM", # commas
    "DTZ", # datetime timezone
    "E",   # pycodestyle errors
    "ERA", # eradicate commented-out code
    "FA",  # future annotations
    "FBT", # boolean trap
    "F",   # pyflakes
    "I",   # import sorting
    "ICN", # import conventions
    "ISC", # implicit str concat
    "N",   # naming conventions
    "PGH", # pygrep-hooks
    "PTH", # pathlib
    "PT",  # pytest style
    "RET", # return statements
    "RUF", # Ruff extra rules
    "TRY", # tryceratops
    "S",   # security
    "SIM", # simplifications
    "C90", # mccabe complexity
    "TID", # tidy imports
    "TC",  # typing under TYPE_CHECKING
    "TD",  # TODOs must be annotated
    "UP",  # pyupgrade / newer syntax
    "W",   # pycodestyle warnings
    "YTT", # flake8-2020
    "T10", # debugger statements
]
ignore = ["TC006"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "A002",
    "ANN001",
    "S101",   # use of assert detected
]
"scripts/release_version.py" = ["S606"]
"yeeter/_runner.py" = ["ANN401", "FBT001", "FBT003", "TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["yeeter"]

[tool.pylint."messages control"]
disable = ["duplicate-code", "no-name-in-module"]

[tool.pylint.basic]
no-docstring-rgx = "^_"

[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 20
max-attributes = 20
