version: "3"

tasks:
  install:
    desc: Install the virtual environment and install the pre-commit hooks
    cmds:
      - 'echo "🚀 Creating virtual environment using uv"'
      - uv sync
      - uv run prek install

  deps-lock: uv lock {{.CLI_ARGS}}

  deps-sync: uv sync --all-groups

  check:
    desc: Run code quality tools
    cmds:
      - 'echo "🚀 Checking lock file consistency with ''pyproject.toml''"'
      - uv lock --locked
      - 'echo "🚀 Linting code: Running pre-commit"'
      - uv run prek run -a

  test:
    desc: Test the code with pytest
    cmds:
      - 'echo "🚀 Testing code: Running pytest"'
      - uv run pytest --cov --cov-config=pyproject.toml --cov-report=xml

  build:
    desc: Build wheel file
    deps: [clean-build]
    cmds:
      - 'echo "🚀 Creating wheel file"'
      - uvx --from build pyproject-build --installer uv

  clean-build:
    desc: Clean build artifacts
    cmds:
      - 'echo "🚀 Removing build artifacts"'
      - 'uv run python -c "import shutil; import os; shutil.rmtree(''dist'') if os.path.exists(''dist'') else None"'

  publish:
    desc: Publish a release to PyPI
    cmds:
      - 'echo "🚀 Publishing."'
      - uvx twine upload --repository-url https://upload.pypi.org/legacy/ dist/*

  build-and-publish:
    desc: Build and publish
    cmds:
      - task: build
      - task: publish

  release-version:
    desc: Bump the project version to today's CalVer, using .postN for same-day follow-ups
    cmds:
      - uv run ./scripts/release_version.py {{.CLI_ARGS}}

  release:
    desc: Trigger the GitHub Actions release PR workflow
    cmds:
      - gh workflow run release-pr.yml --ref main {{.CLI_ARGS}}

  docs-test:
    desc: Test if documentation can be built without warnings or errors
    cmds:
      - uv run mkdocs build -s

  docs:
    desc: Build and serve the documentation
    cmds:
      - uv run mkdocs serve
