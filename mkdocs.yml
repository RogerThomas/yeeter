site_name: yeetr
repo_url: https://github.com/RogerThomas/yeetr
site_url: https://rogerthomas.github.io/yeetr/
site_description: A tiny, typed, signature-driven CLI runner.
site_author: Roger Thomas
edit_uri: edit/main/docs/
repo_name: RogerThomas/yeetr
copyright: Maintained by Roger Thomas.

nav:
  - Home: index.md
  - API Reference: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["yeetr"]
theme:
  name: material
  logo: assets/yeetr.png
  favicon: assets/yeetr.png
  features:
    - navigation.tabs
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RogerThomas/yeetr
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/yeetr

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.snippets:
      base_path:
        - .
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
